# Prefer fish from PATH, regardless of how it was installed.
# Otherwise, keep tmux's automatically selected default shell.
run-shell 'if fish_path=$(command -v fish); then tmux set-option -g default-shell "$fish_path"; fi'
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm*:Tc"

set -g mouse on

# Toggle a persistent popup shell with prefix + p
bind p if-shell -F '#{==:#{session_name},popup}' {
    detach-client
} {
    display-popup -E 'env -u TMUX tmux new-session -A -s popup'
}

# Use vi-style keys in copy mode and prompts
setw -g mode-keys vi
set -g status-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# pi
set -g extended-keys on
set -g extended-keys-format csi-u
